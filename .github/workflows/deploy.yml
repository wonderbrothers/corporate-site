name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # INSIGHTS の予約公開：毎日 日本時間 0:05 にビルドし直し、公開日を迎えた記事を出す
  # （GitHub の定期実行は混雑時に数十分遅れることがある）
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に1つだけデプロイ（実行中のものは完了させる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          # Astro 7 は Node >=22.12 が必須（v6 の既定は 24。これまでどおり 22 に固定）
          node-version: 22
        # 既定で npm install → npm run build を実行し、dist/ を Pages 用にアップロードする

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
