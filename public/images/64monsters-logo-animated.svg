<svg width="869" height="136" viewBox="0 -26 869 136" fill="none" xmlns="http://www.w3.org/2000/svg">
<style><![CDATA[
/* 64MONSTERS の M（モンスター）だけを動かす。
   SVG の中で完結しているので、img で読み込んだままでも動く。
   CSS に不等号を書くと XML として壊れるので CDATA で囲むこと。

   viewBox を上へ 26 広げてあるのは、跳ねたときに角が切れないため。
   文字と M の位置・大きさは元のまま。高さで置くときは 110 ではなく 136 が基準。

   左右の振れは「64」との隙間4.6・「O」との隙間3.8より小さくしてある。
   隣の文字に当たると、ロゴの字組みが崩れて見えるので。 */

/* --- 体：ゆらゆら → 縦に伸びる → 2回ジャンプ。支点は足の裏 --- */
.mon{ transform-origin:255.5px 108.0px; animation:idle 7.2s ease-in-out infinite both; }
@keyframes idle{
  0%, 8%{ transform:translate(0,0) scale(1,1) rotate(0deg); }
  /* 左右にゆらゆら */
  14%{ transform:translate(-1.5px,0) scale(1,1) rotate(-0.7deg); }
  21%{ transform:translate(1.5px,0) scale(1,1) rotate(0.7deg); }
  28%{ transform:translate(-1.1px,0) scale(1,1) rotate(-0.5deg); }
  34%{ transform:translate(0,0) scale(1,1) rotate(0deg); }
  /* ためて、縦に伸びる */
  40%{ transform:translate(0,0) scale(1.045,0.92) rotate(0deg); }
  47%{ transform:translate(0,0) scale(0.96,1.10) rotate(0deg); }
  52%{ transform:translate(0,0) scale(1.01,0.99) rotate(0deg); }
  56%{ transform:translate(0,0) scale(1,1) rotate(0deg); }
  /* 2回ジャンプ */
  61%{ transform:translate(0,0) scale(1.045,0.90) rotate(0deg); }
  67%{ transform:translate(0,-14px) scale(0.96,1.08) rotate(0deg); }
  72%{ transform:translate(0,0) scale(1.045,0.90) rotate(0deg); }
  77%{ transform:translate(0,-7px) scale(0.98,1.05) rotate(0deg); }
  82%{ transform:translate(0,0) scale(1.03,0.94) rotate(0deg); }
  86%{ transform:translate(0,0) scale(0.995,1.015) rotate(0deg); }
  90%, 100%{ transform:translate(0,0) scale(1,1) rotate(0deg); }
}

/* --- 目 --- */
/* まばたきは3つの目がほんの少しずれて閉じる。完全に揃うと機械に見える */
.eye{ animation:blink 6.4s infinite both; }
.e1{ transform-origin:229.00px 47.65px; }
.e2{ transform-origin:256.00px 47.65px; animation-delay:-.02s; }
.e3{ transform-origin:282.75px 47.65px; animation-delay:-.04s; }
/* 黒目の左右。白目の余白は左右とも 6 ほどなので、2.2 なら外に出ない */
.pupil{ animation:look 7.7s infinite both; }
@keyframes blink{
  0%, 40%, 100%{ transform:scaleY(1); }
  41.6%{ transform:scaleY(.05); }
  43.6%{ transform:scaleY(1); }
  48%{ transform:scaleY(1); }
  49.6%{ transform:scaleY(.05); }
  51.6%{ transform:scaleY(1); }
}
@keyframes look{
  0%, 14%{ transform:translateX(0); }
  21%, 33%{ transform:translateX(-2.2px); }
  40%, 50%{ transform:translateX(0); }
  57%, 69%{ transform:translateX(2.2px); }
  76%, 86%{ transform:translateX(-1.1px); }
  92%, 100%{ transform:translateX(0); }
}

@media (prefers-reduced-motion: reduce){
  .mon, .eye, .pupil{ animation:none; }
}
]]></style>
