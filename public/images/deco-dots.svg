<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 232" width="232" height="232" role="img" aria-hidden="true">
<!-- Make（つくる）のグラフィック（6秒ループ）。
     時計回りに一周しながら、内側の輪 → 外側の輪 → 外周の線の順に少しずつ遅れて描いていく。
     描き終えたら少し留まり、同じ向きにもう一周しながら、描いた順に消していく。消えきったらまた描き始める。
     内側の輪 35個・外側の輪 42個・外周の線。
     動きを控える設定では、アニメーション用のグループを隠し、完成形の静止画を表示する。 -->
<style>
.still { display: none; }
@media (prefers-reduced-motion: reduce) { .build { display: none; } .still { display: inline; } }
</style>
