<!-- Learn（学ぶ）のグラフィック（6秒ループ）。
     中心から外へ、一本の渦を描き広げていく（学んだことが積み重なり、広がっていく）。
     描き終えたら少し留まり、同じ向き（中心から外へ）に消していき、また中心から描き始める。
     渦はアルキメデス螺旋 r = 2.35θ（約5周）。元の画像に合わせて位置と太さを測った。
     動きを控える設定では、描き終えた静止画を表示する。 -->
<style>
.still { display: none; }
@media (prefers-reduced-motion: reduce) { .grow { display: none; } .still { display: inline; } }
</style>
