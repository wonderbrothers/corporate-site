# ==================================================================
# 日本語版の文章（https://wonder-bros.com/ と /contact/）
#
# ・英語版は en.yaml。項目名（: の左側）は両方で同じにそろえる。
# ・文章を直すときは : の右側だけを書き換える。項目名や字下げは変えない。
# ・空欄（""）にした項目は、そのページでは表示されない。
# ・書ける記法
#     \n              … 改行（見出しの意図的な改行）。"…" で囲んだ文字の中でだけ使える
#     |               … ここで改行してよい文節の区切り（表示はされない）
#     {{ … }}         … この中では改行しない
#     [文字](/path/)  … リンク
# ・構成・表記の方針は docs/site-restructure-2026-09.md を参照。
#   「DISCOVER. MAKE. LEARN.」「見つける。つくる。学ぶ。」は省略・言い換えをしない。
# ==================================================================

lang: ja

meta:
  title: "株式会社ワンダーブラザース｜答えのない問いを、つくることで確かめる。"
  description: "WONDER BROTHERS（株式会社ワンダーブラザース）は、まだ答えのない課題やアイデアを形にして試し、そこで得た事実を次の判断につなげるデザインスタジオです。新規サービス設計、UX/UI、PoCの設計・検証、プロダクト開発、DXを支援しています。"
  siteName: "株式会社ワンダーブラザース"
  slogan: "答えのない問いを、つくることで確かめる。"

# ---------- 共通 ----------
principle:
  en: "DISCOVER. MAKE. LEARN."
  local: "見つける。つくる。学ぶ。"

nav:
  home: "ページの先頭へ"
  main: "メインナビゲーション"
  openMenu: "メニューを開く"
  closeMenu: "メニューを閉じる"
  menu: "メニュー"
  contactTitle: "お問い合わせ"
  contactNote: "CONTACT"
  # 言語切り替え（もう一方の言語へのリンク）
  switchLabel: "EN"
  switchName: "English"

footer:
  copyright: "© WONDER BROTHERS INC. All rights reserved."
  privacy: "Privacy Policy"
  cookie: "Cookie設定"

# ---------- 01 HERO ----------
hero:
  logoAlt: "株式会社ワンダーブラザース"
  lines: ["Build to explore", "the unanswered."]
  title: "答えのない問いを、\nつくることで確かめる。"
  body:
    - "WONDER BROTHERSは、まだ答えのない課題やアイデアを形にして試し、そこで得た事実を次の判断につなげるデザインスタジオです。"
    - "サービスや体験、プロトタイプをつくり、実際の使われ方や反応から、構想を具体化していきます。"

# ---------- 02 APPROACH ----------
approach:
  display: "APPROACH"
  tagline: "We think by making."
  heading: "考えるだけで終わらせない。"
  body:
    - "新しいサービスやプロダクトは、最初から答えが分かっているものばかりではありません。人や状況を観察し、試し、得られた反応をもとに考え直す。その繰り返しで、構想を育てていきます。"
  # 並び順・グラフィックはページの型で固定（Discover → Make → Learn）
  steps:
    discover:
      title: "Discover"
      subtitle: "見つける"
      text: "人の行動や業務、環境、情報の流れを観察し、まだ言葉になっていない課題を整理します。依頼の背景も一緒にひもときながら、取り組むべき問題と、最初に確かめることを見極めます。"
    make:
      title: "Make"
      subtitle: "つくる"
      text: "問いや仮説を、実際に試せる形にします。画面、プロトタイプ、サービス体験など、確かめたいことに合わせて、つくるものと範囲を決めます。"
    learn:
      title: "Learn"
      subtitle: "学ぶ"
      text: "実際の使われ方や反応から、想定との違いや新たな課題を整理します。得られたことをもとに、開発へ進むか、見直して再び試すか、取り組みを止めるかを検討します。"
  cycle:
    steps: ["Discover", "Make", "Learn"]
    label: "Discover, Make, Learn, and back to Discover again"
    text: "学んだことを、次の判断につなげる。"

# ---------- 03 CLIENT WORK ----------
work:
  display: "CLIENT WORK"
  tagline: "From early ideas to development and improvement."
  heading: "構想から開発、改善まで、一緒に取り組む。"
  body:
    - "新規サービスやデジタルプロダクトの構想整理から、サービス設計、UX/UI、PoC、開発、既存サービスの改善まで支援しています。"
    - "プロジェクトの目的や現在の課題に合わせて、必要な支援範囲と進め方を一緒に組み立てます。"
  services:
    - name: "New Service Design"
      label: "新規サービス設計"
      text: "構想やアイデアを整理し、誰のどんな課題を解決するサービスなのかを具体化します。提供する価値と、最初に確かめることを明らかにします。"
    - name: "UX / UI Design"
      label: "UX/UIデザイン"
      text: "利用者の行動や利用状況をもとに、情報の構成と操作の流れを設計します。複雑なサービスでも、必要な情報を見つけやすく、迷わず使える体験を目指します。"
    - name: "PoC Design & Validation"
      label: "PoC設計・検証"
      # この項目だけ、本文の代わりに下の poc の内容を表示する
      poc:
        lead: "本番へ進むか判断できる{{PoCを設計する。}}"
        body:
          - "ユーザーに必要とされるか、技術的に実現・運用できるか、事業として成り立つか。プロジェクトで優先して確かめるべきことを整理し、検証方法と試作する範囲を設計します。"
          - "結果を振り返り、本番開発に進むための条件や、追加で確かめるべき課題を明らかにします。"
        checks:
          - name: "Desirability"
            label: "求められているか"
          - name: "Feasibility"
            label: "つくれるか、運用できるか"
          - name: "Viability"
            label: "事業として成り立つか"
        note: "3つを一度に確かめる必要はありません。どれが一番分かっていないかを見極め、そこから検証します。"
    - name: "Product Development"
      label: "プロダクト開発"
      text: "検証で見えてきた方向性をもとに、実際に使われるプロダクトへと具体化します。必要に応じてエンジニアと連携し、UX/UIの設計から実装、リリース後の改善まで関わります。"
    - name: "DX / Service Transformation"
      label: "DX・サービス変革"
      text: "利用者、業務、情報、システムの関係を整理し、既存の業務やサービスのどこを変えるべきかを明らかにします。小さな検証も取り入れながら、現場で使える仕組みへと改善します。"

# ---------- 04 SELECTED WORK（CLIENT WORK の中） ----------
# 掲載しないもの：クライアント名／固有のサービス名・プロジェクト名／機密性の高い数値／
# 公開許可のない画面／特定企業を推測できる内部情報／実際には行っていない工程／成果数値の創作。
# 業種は「損害保険会社」「金融サービス事業者」程度の粒度にとどめる。
# 事例を足すときは ja.yaml と en.yaml の両方に、同じ順番で足す。
cases:
  title: "SELECTED WORK"
  intro: "守秘義務のため、企業名やプロジェクト名は掲載していません。各事例で取り組んだ課題と、支援内容をご紹介します。"
  questionLabel: "QUESTION"
  stepLabels: { discover: "DISCOVER", make: "MAKE", learn: "LEARN" }
  listLabel: "事例"
  prev: "前の事例を見る"
  next: "次の事例を見る"
  items:
    - industryLabel: "INSURANCE"
      industry: "損害保険|会社"
      question: "複雑な保険情報を、利用者が迷わず理解できるようにするには。"
      discover: "商品、契約、手続きに関する情報構造とユーザー行動を整理し、理解や判断が難しくなるポイントを特定。"
      make: "UX、情報設計、UI、プロトタイプを通じて、複雑な情報を利用者が理解しやすい体験へ具体化。"
      learn: "関係者レビューや検証で見えた課題を整理し、設計に反映。その後、実装を経てリリース。"
    - industryLabel: "FINANCIAL SERVICES"
      industry: "金融サービス|事業者"
      question: "新しいサービスの構想を、関係者が具体的に共有し、検討できる形にするには。"
      discover: "構想の背景、想定する利用者、既存の業務や制約を整理し、検証すべき論点を明確化。"
      make: "サービス像を画面とプロトタイプで可視化。関係者が体験として確かめられる状態を構築。"
      learn: "検討で得た意見や課題を開発要件に反映。その後、開発を経てサービスを公開。"
    - industryLabel: "ENTERTAINMENT"
      industry: "エンターテインメント|事業者"
      question: "事業の要件と使いやすさを両立し、新しいサービスを実装につなげるには。"
      discover: "事業の目的や想定するユーザー行動を整理し、サービスとして成立させるために必要な体験と機能の優先順位を明確化。"
      make: "仮説をもとにUX、UI、プロトタイプを設計し、開発へつながりやすい情報構造とデザインルールを整備。"
      learn: "関係者とのレビューや検証を重ね、事業要件とユーザー体験を両立する形へ調整。実装からリリースまで一貫して対応。"
  more: "ほかの事例は、ご相談の際に個別にご紹介しています。"
  button: "プロジェクトについて相談する"
  buttonNote: "Discuss a project"

# ---------- 05 WONDER LAB ----------
lab:
  display: "WONDER LAB"
  tagline: "Ideas should be tested, not just discussed."
  heading: "自分たちの問いも、つくって確かめる。"
  body: "WONDER LABでは、自分たちの疑問やアイデアを、サービスやプロダクトとして試しています。事業化の見通しがまだないアイデアも小さく形にして公開し、使われ方や反応から可能性を探ります。クライアントワークと同じように、自分たちでも実験を重ねています。"
  prev: "前のプロジェクトを見る"
  next: "次のプロジェクトを見る"
  # ロゴ・URL・並び順はページの型で固定。ここは文章だけ
  projects:
    64monsters:
      theme: "人をどう理解するか。"
      question: "人を「ユーザー」という言葉だけで理解できるだろうか。"
      context: "ユーザーを理解しようとするとき、属性やペルソナだけでは捉えきれない面があります。64MONSTERSは、人を複数の視点から捉え、自分の傾向を振り返る体験をつくれないか、という問いから生まれました。"
      discover: "ユーザーを属性やひとつのタイプだけで捉えることの限界に着目し、人をより多面的に捉える方法はないか、という問いを設定。"
      make: "複数の軸から、その時々の傾向を振り返る診断体験を制作。タイプに加え、スコアや、繰り返し診断したときの変化も見られるように設計。"
      learn: "公開後の利用から得た、タイプだけでなく、その時々の傾向や変化も自己理解の手がかりになるのではないかという気づき。実際の使われ方を通じた、継続的な検証。"
    rensougame:
      theme: "どう考え、仮説を確かめるか。"
      question: "ニュースを読むだけで、考える力は身につくだろうか。"
      context: "ひとつの出来事が起きたとき、その影響はひとつでは終わりません。経済、企業、暮らし、市場へと連鎖していきます。けれど普段のニュース体験では、結果を受け取るだけになりがちです。"
      discover: "ニュースを読むことが、必ずしも「その先を考えること」や「仮説を確かめること」につながっていない点に着目。"
      make: "ニュースを起点に、その後の影響や別のシナリオを考え、実際の結果と照らし合わせる体験をゲームとして制作。"
      learn: "公開後の「難しい」という声から見えた、考える手応えと取り組みやすさを両立する課題。自分の考え方を振り返り、次のニュースにも挑戦したくなる体験に向けた、難易度と続けやすい仕組みの見直し方針。"
    forest:
      theme: "価値をどう見つけるか。"
      question: "価値がまだわからないものから、価値を見つけることはできるだろうか。"
      context: "北海道の森を取得したことから始まった実験です。水道も電気もなく、土地の境界もはっきりしない場所で、まずは環境や資源を知ることから始めました。何をつくるかを先に決めず、実際に森に入り、できることを探っています。"
      discover: "森に入り、環境、植物、土地の特徴を観察して、この場所にどんな可能性があるのかを探索。"
      make: "トドマツの枝葉から精油を抽出し、成分分析を実施。"
      learn: "精油の抽出と成分分析から得た、森の資源を具体的に調べる手がかり。用途や事業化を急いで決めず、観察と実験を重ねながら、この場所の可能性を探っていく。"
  closing: "デジタルでも、森でも、\n私たちがやっていることは同じです。"

# ---------- 06 OUR BELIEF ----------
belief:
  label: "OUR BELIEF"
  lines: ["Design is not", "decoration."]
  body:
    - "私たちは、見た目を整えることに加え、複雑な状況を整理し、取り組むべき問題や確かめ方を考えることも、デザインの役割だと考えています。"
    - "AIによってつくること自体のコストが下がるほど、何をつくり、何を確かめ、何をAIに任せ、どこを人が判断するのかが問われるようになります。私たちは、プロダクトとともに、その意思決定の進め方も設計します。"
  closingTagline: "Design is how we discover, make, and learn."
  closing: "デザインは、見つけ、つくり、学ぶための方法です。"

