contact:
  title: "CONTACT"
  lead: "まだ具体的な企画になっていない段階でも構いません。"
  intro: "たとえば、次のような段階からご相談いただけます。"
  cases:
    - "新しいサービスを|考えているが、|進めるべきか|判断できない"
    - "PoCをしたいが、|何を検証すべきか|整理できていない"
    - "AIを活用したいが、|どこから始めればよいか|分からない"
