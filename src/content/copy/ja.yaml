governance:
  title: "SECURITY & GOVERNANCE"
  lead: "安心してプロジェクトをお任せいただくために。"
  body: "情報管理、セキュリティ、ガバナンス体制の整備に継続して取り組んでいます。業務執行の監督や適切な情報開示のための社内体制づくりを進め、公平で透明性のある意思決定を目指しています。個人情報の取り扱いについては、[プライバシーポリシー](/privacy/)をご覧ください。"

